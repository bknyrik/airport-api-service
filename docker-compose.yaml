services:
  airport:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - airport_media:/files/media
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - database

  database:
    image: postgres:18.3-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  airport_media:
